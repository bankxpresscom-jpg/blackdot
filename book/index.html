    const m = location.pathname.match(/^\/books\/(\d+)/);
    if(m) return parseInt(m[1], 10);
    return parseInt(new URLSearchParams(location.search).get('id') || '0', 10);
  }

  function notFound(){
    document.title = 'Book not found | Blackdot Publication';
    app.innerHTML = `<div class="notfound"><h1>We couldn't find that book</h1><p>It may have been moved or is no longer available.</p><a class="bd-btn bd-btn-dark" href="/books/">Browse all books</a></div>`;

      if(!id) return notFound();
      try { data = await BD.api('/api/books/' + id); }
      catch(e){ return e.status === 404 ? notFound() : (app.innerHTML = `<div class="notfound"><h1>Something went wrong</h1><p>${esc(e.message)}</p><button class="bd-btn bd-btn-dark" onclick="location.reload()">Try again</button></div>`); }
      document.title = `${data.book.title} by ${data.book.author} | Blackdot Publication`;
    }
    if(location.pathname !== data.book.url && /^\/books\//.test(location.pathname) === false){
      history.replaceState(null, '', data.book.url + location.search + location.hash);
    }
    const cfg = await BD.config();
    render(data, cfg);
  }

  function wireGallery(images, b){
    const track = document.getElementById('main-track');
    const thumbs = document.querySelectorAll('[data-thumb]');
    const dots = document.querySelectorAll('#stage-dots span');
    const go = (i) => track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
    thumbs.forEach(t => t.addEventListener('click', () => go(parseInt(t.dataset.thumb, 10))));
    track.addEventListener('scroll', () => {
      const i = Math.round(track.scrollLeft / (track.clientWidth || 1));
      thumbs.forEach((t, k) => t.classList.toggle('on', k === i));
      dots.forEach((d, k) => d.classList.toggle('on', k === i));
    }, { passive: true });

    const lb = document.getElementById('lightbox');
    const lbImg = lb.querySelector('img');
    const lbCount = lb.querySelector('.lb-count');
    lb.querySelector('.lb-close').innerHTML = ICONS.close;
    let cur = 0;
    const show = (i) => {
      cur = (i + images.length) % images.length;
      lbImg.src = img(images[cur], 1400);
      lbImg.alt = `${b.title} — image ${cur + 1}`;
      lbCount.textContent = images.length > 1 ? `${cur + 1} / ${images.length}` : '';
      lb.querySelectorAll('.lb-prev,.lb-next').forEach(x => x.style.display = images.length > 1 ? '' : 'none');
    };
    track.querySelectorAll('[data-zoom]').forEach(btn => btn.addEventListener('click', () => {
      show(parseInt(btn.dataset.zoom, 10)); lb.classList.add('open'); document.documentElement.style.overflow = 'hidden';
      lb.querySelector('.lb-close').focus();
    }));
    const close = () => { lb.classList.remove('open'); document.documentElement.style.overflow = ''; };
    lb.addEventListener('click', e => {
      const a = e.target.closest('[data-lb]');
      if(a){ a.dataset.lb === 'close' ? close() : show(cur + (a.dataset.lb === 'next' ? 1 : -1)); return; }
      if(e.target === lb) close();
    });
    document.addEventListener('keydown', e => {
      if(!lb.classList.contains('open')) return;
      if(e.key === 'Escape') close();
      if(e.key === 'ArrowRight') show(cur + 1);
      if(e.key === 'ArrowLeft') show(cur - 1);
    });
  }

  function wireAbout(){
    const t = document.getElementById('about-text');
    const more = document.getElementById('read-more');
    t.classList.add('clamp');
    requestAnimationFrame(() => {
      if(t.scrollHeight > t.clientHeight + 4){
        more.hidden = false;
        more.addEventListener('click', () => {
          const clamped = t.classList.toggle('clamp');
          more.textContent = clamped ? 'Read More' : 'Read Less';
        });
      } else t.classList.remove('clamp');
    });
  }

  function wireOpeners(){
    document.querySelectorAll('[data-open]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      const acc = document.getElementById(a.dataset.open);
      acc.open = true;
      if(a.hasAttribute('data-write')) openReviewForm();
      acc.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }

  function wireBuy(b, cfg){
    const qtyEl = document.getElementById('qty');
    const qty = () => parseInt(qtyEl.value, 10) || 1;
    const buy = () => BD.buyNow.start(b.id, qty());
    const add = () => BD.addToCart(b, qty());
    document.querySelector('[data-buy]').addEventListener('click', buy);
    document.querySelector('[data-add]').addEventListener('click', add);

    // sticky bar on phones once the main buttons scroll away
    const bar = document.getElementById('sticky-buy');
    bar.innerHTML = `<div class="sp"><strong>${money(b.price_paise)}</strong><span>${esc(b.title)}</span></div>
      <button class="bd-btn bd-btn-outline" type="button" aria-label="Add to cart">${ICONS.cart}</button>
      <button class="bd-btn bd-btn-primary" type="button">Buy Now</button>`;
    const [barAdd, barBuy] = bar.querySelectorAll('button');
    barAdd.addEventListener('click', add);
    barBuy.addEventListener('click', buy);
    const cta = document.getElementById('main-cta');
    new IntersectionObserver(([en]) => {
      const show = !en.isIntersecting && en.boundingClientRect.top < 0;
      bar.classList.toggle('show', show);
      bar.setAttribute('aria-hidden', show ? 'false' : 'true');
    }).observe(cta);

    // pincode check
    const form = document.getElementById('pin-form');
    const out = document.getElementById('pin-result');
    const pinEl = document.getElementById('pin');
    try { const saved = localStorage.getItem('bd_pin'); if(saved) pinEl.value = saved; } catch(e){}
    pinEl.addEventListener('input', () => { pinEl.value = pinEl.value.replace(/\D/g, '').slice(0, 6); });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const pin = pinEl.value.trim();
      out.className = 'pin-result';
      if(!/^[1-9]\d{5}$/.test(pin)){ out.textContent = 'Please enter a valid 6-digit pincode.'; return; }
      out.textContent = 'Checking…';
      try { localStorage.setItem('bd_pin', pin); } catch(e){}
      let place = '';
      try { const r = await BD.api('/api/pincode/' + pin); if(r.found) place = `${r.city}, ${r.state}`; } catch(e){}
      out.className = 'pin-result ok';
      out.textContent = `✓ Delivery available${place ? ' to ' + place : ''}. Expected between ${BD.deliveryRange(cfg)}.`;
    });
  }

  function wireShare(b){
    document.getElementById('share-btn').addEventListener('click', async () => {
      const url = location.origin + b.url;
      if(navigator.share){
        try { await navigator.share({ title: b.title, text: `${b.title} by ${b.author}`, url }); } catch(e){}
        return;
      }
      try { await navigator.clipboard.writeText(url); BD.toast('Link copied'); }
      catch(e){ prompt('Copy this link', url); }
    });
  }

  let reviewState = { filter: 0, shown: 6 };
  let reviewData = null;

  function renderReviews(data){
    reviewData = data;
    const b = data.book;
    const body = document.getElementById('reviews-body');
    const total = b.rating_count;
    const dist = data.distribution || {};
    body.innerHTML = `
      ${total ? `
      <div class="rv-summary">
        <div class="rv-score"><div class="big">${b.rating_avg.toFixed(1)}</div><div style="margin-top:8px">${stars(b.rating_avg, 20)}</div><div class="sub">Based on ${total} review${total === 1 ? '' : 's'}</div></div>
        <div class="bars">${[5,4,3,2,1].map(n => {
          const c = dist[n] || 0; const pct = total ? Math.round(c / total * 100) : 0;
          return `<button class="bar${reviewState.filter === n ? ' on' : ''}" type="button" data-filter="${n}" aria-label="Show ${n} star reviews (${c})"><span>${n} star</span><span class="track"><i style="width:${pct}%"></i></span><span>${pct}%</span></button>`;
        }).join('')}</div>
      </div>` : ''}
      <div class="rv-tools">
        <span class="rv-filter-note" id="rv-note"></span>
        <button class="bd-btn bd-btn-dark bd-btn-sm" type="button" id="write-btn">Write a Review</button>
      </div>
      ${reviewFormHtml(b)}
      <div id="rv-list"></div>`;
    body.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
      const n = parseInt(btn.dataset.filter, 10);
      reviewState.filter = reviewState.filter === n ? 0 : n;
      reviewState.shown = 6;
      body.querySelectorAll('[data-filter]').forEach(x => x.classList.toggle('on', parseInt(x.dataset.filter, 10) === reviewState.filter));
      renderReviewList();
    }));
    document.getElementById('write-btn').addEventListener('click', () => openReviewForm(true));
    wireReviewForm(b);
    renderReviewList();
  }

  function renderReviewList(){
    const list = document.getElementById('rv-list');
    const note = document.getElementById('rv-note');
    const all = reviewData.reviews || [];
    const items = reviewState.filter ? all.filter(r => r.rating === reviewState.filter) : all;
    note.innerHTML = reviewState.filter ? `Showing ${reviewState.filter}-star reviews · <button class="bd-link" type="button" id="clear-filter">Show all</button>` : (all.length ? `${all.length} review${all.length === 1 ? '' : 's'}` : '');
    const clr = document.getElementById('clear-filter');
    if(clr) clr.addEventListener('click', () => { reviewState.filter = 0; document.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('on')); renderReviewList(); });
    if(!items.length){
      list.innerHTML = `<div class="rv-empty">${all.length ? 'No reviews with this rating yet.' : 'No reviews yet. Read it? Share what you thought, your review helps other readers.'}</div>`;
      return;
    }
    list.innerHTML = items.slice(0, reviewState.shown).map(r => `
      <article class="rv">
        <div class="rv-head"><span class="avatar" aria-hidden="true">${esc((r.name || '?').trim().charAt(0).toUpperCase())}</span><span class="rv-name">${esc(r.name)}</span>${r.verified ? '<span class="bd-badge bd-badge-green">✓ Verified Purchase</span>' : ''}</div>
        <div class="rv-meta">${stars(r.rating, 14)}<span>${esc(BD.fmtDay(r.created_at))}</span></div>
        ${r.title ? `<div class="rv-title">${esc(r.title)}</div>` : ''}
        <div class="rv-body">${esc(r.body)}</div>
        ${r.reply ? `<div class="rv-reply"><strong>Response from Blackdot</strong>${esc(r.reply)}</div>` : ''}

      (items.length > reviewState.shown ? `<div style="padding-top:18px"><button class="bd-btn bd-btn-ghost" type="button" id="more-reviews">Show more reviews</button></div>` : '');
    const more = document.getElementById('more-reviews');
    if(more) more.addEventListener('click', () => { reviewState.shown += 10; renderReviewList(); });
  }

  function wireReviewForm(b){
    const form = document.getElementById('rv-form');
    let rating = 0;
    const btns = form.querySelectorAll('[data-star]');
    const paint = (n) => btns.forEach(x => x.classList.toggle('on', parseInt(x.dataset.star, 10) <= n));
    btns.forEach(x => {
      x.addEventListener('mouseenter', () => paint(parseInt(x.dataset.star, 10)));
      x.addEventListener('mouseleave', () => paint(rating));
      x.addEventListener('click', () => {
        rating = parseInt(x.dataset.star, 10);
        paint(rating);
        btns.forEach(y => y.setAttribute('aria-checked', String(parseInt(y.dataset.star, 10) === rating)));
        document.getElementById('star-text').textContent = STAR_WORDS[rating];
      });
    });
    // Prefill from the Track Order page ("Write a review" link).
    try {
      const pre = JSON.parse(sessionStorage.getItem('bd_review_prefill') || 'null');
      if(pre && pre.book_id === b.id){
        document.getElementById('rv-order').value = pre.order_id || '';
        document.getElementById('rv-phone').value = pre.phone || '';
        document.getElementById('rv-name').value = pre.name || '';
      }
    } catch(e){}
    document.getElementById('rv-cancel').addEventListener('click', () => form.classList.remove('open'));
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const msg = document.getElementById('rv-msg');
      const btn = document.getElementById('rv-submit');
      msg.className = 'form-msg err';
      const payload = {
        rating,
        name: document.getElementById('rv-name').value.trim(),
        title: document.getElementById('rv-title').value.trim(),
        body: document.getElementById('rv-body').value.trim(),
        order_id: document.getElementById('rv-order').value.trim(),
        phone: document.getElementById('rv-phone').value.trim(),
        website: document.getElementById('rv-website').value,
      };
      if(!rating){ msg.textContent = 'Please choose a star rating.'; return; }
      if(payload.name.length < 2){ msg.textContent = 'Please enter your name.'; return; }
      if(payload.body.length < 10){ msg.textContent = 'Please write at least a sentence about the book.'; return; }
      if((payload.order_id && !payload.phone) || (!payload.order_id && payload.phone)){ msg.textContent = 'For a Verified Purchase badge, enter both the order number and the mobile number. Or leave both blank.'; return; }
      btn.disabled = true; btn.textContent = 'Submitting…'; msg.textContent = '';
      try {
        const r = await BD.api(`/api/books/${b.id}/reviews`, { method: 'POST', body: payload });
        try { sessionStorage.removeItem('bd_review_prefill'); } catch(e){}
        if(r.status === 'approved'){
          const fresh = await BD.api('/api/books/' + b.id);
          reviewData = fresh;
          renderReviews(fresh);
          document.querySelector('#reviews h2').textContent = `Customer Reviews (${fresh.book.rating_count})`;
          BD.toast('Thank you! Your verified review is live.');
        } else {
          form.innerHTML = `<h3>Thank you for your review!</h3><p class="hint" style="margin:0">It will appear here once our team has checked it, usually within a day.</p>`;
        }
      } catch(err){
        msg.textContent = err.message;
        btn.disabled = false; btn.textContent = 'Submit Review';
      }
    });
  }

  load();
})();
</script>
</body>
</html>
