<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Track Your Order | Blackdot Publication</title>
<meta name="description" content="Track your Blackdot Publication order and download your invoice.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 14c8-4 16-4 24 0v34c-8-4-16-4-24 0V14z' fill='none' stroke='%23000' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M56 14c-8-4-16-4-24 0v34c8-4 16-4 24 0V14z' fill='none' stroke='%23000' stroke-width='2.5' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='30' r='4.5' fill='%23000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/store.css">
<script src="/assets/store.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bd-bg);color:var(--bd-ink);font-family:var(--bd-sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  img{display:block;max-width:100%;}
  .wrap{max-width:820px;margin:0 auto;padding:36px 20px 20px;}
  h1{font:500 clamp(32px,5vw,44px)/1.1 var(--bd-serif);margin-bottom:8px;}
  .lead{color:var(--bd-muted);margin-bottom:26px;}
  .panel{background:#fff;border:1px solid var(--bd-border);border-radius:12px;padding:24px;margin-bottom:18px;}
  .panel h2{font:600 20px var(--bd-serif);margin-bottom:14px;}
  .lookup{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;}
  @media(max-width:640px){.lookup{grid-template-columns:1fr;}}
  .f label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;}
  .f input{width:100%;padding:12px;border:1px solid #D9D9D9;border-radius:var(--bd-radius);font:15px var(--bd-sans);}
  .f input:focus{outline:none;border-color:var(--bd-gold);box-shadow:0 0 0 3px var(--bd-gold-soft);}
  .msg{font-size:14px;color:var(--bd-red);margin-top:12px;min-height:20px;}
  .recent a{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0F0F0;text-decoration:none;font-size:14px;}
  .recent a:last-child{border-bottom:0;}
  .recent a:hover strong{text-decoration:underline;}
  .recent span{color:var(--bd-muted);}

  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .head .meta{font-size:13.5px;color:var(--bd-muted);margin-top:4px;}
  .head-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .timeline{display:grid;grid-template-columns:repeat(4,1fr);margin:30px 0 8px;position:relative;}
  .tl{text-align:center;position:relative;font-size:13px;color:var(--bd-muted);padding:0 4px;}
  .tl::before{content:'';position:absolute;top:15px;left:-50%;right:50%;height:3px;background:#E8E8E8;z-index:0;}
  .tl:first-child::before{display:none;}
  .tl.done::before,.tl.current::before{background:var(--bd-gold);}
  .tl .c{width:32px;height:32px;border-radius:50%;margin:0 auto 8px;background:#fff;border:2px solid #DCDCDC;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;}
  .tl .c svg{width:16px;height:16px;}
  .tl.done .c{background:var(--bd-gold);border-color:var(--bd-gold);color:#fff;}
  .tl.current .c{border-color:var(--bd-gold);background:#fff;box-shadow:0 0 0 5px var(--bd-gold-soft);}
  .tl.current .c::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--bd-gold);}
  .tl.done,.tl.current{color:var(--bd-ink);font-weight:500;}
  .tl small{display:block;font-weight:400;color:var(--bd-muted);font-size:11.5px;margin-top:2px;}
  @media(max-width:520px){.tl{font-size:11.5px;}}
  .alert{padding:12px 14px;border-radius:8px;font-size:14px;margin-top:14px;}
  .alert.warn{background:#FFF7E6;color:#8A5A00;}
  .alert.info{background:var(--bd-gold-soft);color:var(--bd-gold-dark);}
  .tracking{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:14px 16px;border:1px dashed #D8C9A6;border-radius:8px;background:#FFFCF5;font-size:14px;}
  .tracking strong{font-size:15px;letter-spacing:.03em;}
  .item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #F0F0F0;font-size:14.5px;}
  .item:last-of-type{border-bottom:0;}
  .item h3{font:600 17px var(--bd-serif);}
  .item .sub{font-size:12.5px;color:var(--bd-muted);}
  .item .rv{font-size:13px;margin-top:4px;}
  .sum .r{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:#374151;}
  .sum .r.t{font-weight:600;font-size:16px;color:var(--bd-ink);border-top:1px solid var(--bd-border);margin-top:8px;padding-top:10px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  .addr{white-space:pre-line;font-size:14.5px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<script>BD.header('track');</script>

<main class="wrap">
  <div id="lookup-view">
    <h1>Track your order</h1>
    <p class="lead">Enter your order number and the mobile number you used at checkout.</p>
    <form class="panel" id="lookup-form">
      <div class="lookup">
        <div class="f"><label for="oid">Order number</label><input id="oid" inputmode="numeric" placeholder="e.g. 1042" required></div>
        <div class="f"><label for="ophone">Mobile number</label><input id="ophone" type="tel" inputmode="tel" placeholder="10-digit mobile" required></div>
        <button class="bd-btn bd-btn-gold" type="submit" id="lookup-btn">Track Order</button>
      </div>
      <div class="msg" id="lookup-msg" role="alert"></div>
    </form>
    <div class="panel recent hidden" id="recent"><h2>Orders on this device</h2><div id="recent-list"></div></div>
  </div>

  <div id="order-view" class="hidden"></div>
</main>

<script>BD.footer();</script>

<script>
(function(){
  const { esc, money, ICONS } = BD;
  const $ = (id) => document.getElementById(id);
  const STEPS = [
    ['Received', 'Order placed'],
    ['Processing', 'Packing'],
    ['Sent', 'Shipped'],
    ['Delivered', 'Delivered'],
  ];

  const recent = BD.myOrders.get();
  if(recent.length){
    $('recent').classList.remove('hidden');
    $('recent-list').innerHTML = recent.map(o => `<a href="/order/?id=${o.id}&t=${encodeURIComponent(o.t)}"><strong>Order #${o.id}</strong><span>${esc(BD.fmtDay(o.date))} · ${money(o.total)}</span></a>`).join('');
  }

  async function lookup(params){
    const qs = new URLSearchParams(params).toString();
    const data = await BD.api('/api/orders/lookup?' + qs);
    render(data.order);
  }

  $('lookup-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('lookup-btn');
    $('lookup-msg').textContent = '';
    btn.disabled = true; btn.textContent = 'Finding…';
    try { await lookup({ id: $('oid').value.replace(/\D/g, ''), phone: $('ophone').value }); }
    catch(err){ $('lookup-msg').textContent = err.message; }
    btn.disabled = false; btn.textContent = 'Track Order';
  });

  function render(o){
    const paid = o.payment_status === 'paid';
    const idx = STEPS.findIndex(s => s[0] === o.fulfillment_status);
    const dates = { Received: o.paid_at || o.created_at, Sent: o.dispatched_at, Delivered: o.delivered_at };
    const invoiceUrl = `/invoice/?id=${o.id}&t=${encodeURIComponent(o.access_token)}`;
    history.replaceState(null, '', `/order/?id=${o.id}&t=${encodeURIComponent(o.access_token)}`);
    BD.myOrders.add({ id:o.id, t:o.access_token, total:o.amount_paise, date:o.created_at, items:o.items.length });

    const timeline = STEPS.map(([key, label], i) => {
      const cls = !paid ? '' : (i < idx || (i === idx && i === STEPS.length - 1) ? 'done' : (i === idx ? 'current' : ''));
      const d = paid && i <= idx && dates[key] ? `<small>${esc(BD.fmtDay(dates[key]))}</small>` : '';
      return `<div class="tl ${cls}"><div class="c">${cls === 'done' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : ''}</div>${label}${d}</div>`;
    }).join('');

    let statusNote = '';
    if(o.payment_status === 'created') statusNote = `<div class="alert warn">We haven't received payment for this order yet. If money was deducted from your account, it will be confirmed automatically within a few minutes; otherwise <a class="bd-link" style="color:inherit" target="_blank" rel="noopener" href="${esc(BD.whatsappLink('Hi, I need help with payment for order #' + o.id))}">message us</a>.</div>`;
    else if(o.payment_status === 'failed') statusNote = `<div class="alert warn">The payment for this order did not go through, so it won't be shipped. You can place the order again from the <a class="bd-link" style="color:inherit" href="/books/">bookstore</a>.</div>`;
    else if(o.fulfillment_status === 'Delivered') statusNote = `<div class="alert info">Delivered. We hope you love your books! Your review helps other readers discover them.</div>`;

    const tracking = o.tracking_number ? `<div class="tracking"><div>${esc(o.courier_name || 'Courier')}<br><strong>${esc(o.tracking_number)}</strong></div><button class="bd-btn bd-btn-ghost bd-btn-sm" type="button" id="copy-awb">${ICONS.copy} Copy tracking no.</button></div>` : '';

    $('order-view').innerHTML = `
      <div class="panel">
        <div class="head">
          <div><h1 style="font-size:34px;margin:0">Order #${o.id}</h1><div class="meta">Placed ${esc(BD.fmtDateTime(o.created_at))}${o.invoice_no ? ' · Invoice ' + esc(o.invoice_no) : ''}</div></div>
          <div class="head-actions">
            ${paid ? `<a class="bd-btn bd-btn-outline bd-btn-sm" href="${invoiceUrl}" target="_blank" rel="noopener">${ICONS.print} Invoice</a>` : ''}
            <a class="bd-btn bd-btn-ghost bd-btn-sm" target="_blank" rel="noopener" href="${esc(BD.whatsappLink('Hi Blackdot Publication, I have a question about my order #' + o.id + '.'))}">${ICONS.chat} Help</a>
          </div>
        </div>
        <div class="timeline">${timeline}</div>
        ${statusNote}
        ${tracking}
      </div>
      <div class="panel">
        <h2>Items</h2>
        ${o.items.map(it => `<div class="item"><div><h3>${esc(it.title)}</h3><div class="sub">${esc(it.author || '')}${it.author ? ' · ' : ''}${esc(it.format)} · Qty ${it.quantity}</div>${paid && it.book_id ? `<div class="rv"><a class="bd-link" href="/books/${it.book_id}#write-review" data-review="${it.book_id}">Write a review</a></div>` : ''}</div><div>${money(it.unit_price_paise * it.quantity)}</div></div>`).join('')}
        <div class="sum">
          <div class="r"><span>Subtotal</span><span>${money(o.subtotal_paise)}</span></div>
          <div class="r"><span>Shipping</span><span>${o.shipping_paise ? money(o.shipping_paise) : 'Free'}</span></div>
          <div class="r t"><span>${paid ? 'Total paid' : 'Total'}</span><span>${money(o.amount_paise)}</span></div>
        </div>
      </div>
      <div class="grid2">
        <div class="panel"><h2>Shipping to</h2><div class="addr"><strong>${esc(o.buyer_name)}</strong>\n${esc(o.shipping_address)}\n+91 ${esc(o.buyer_phone)}</div></div>
        <div class="panel"><h2>Payment</h2><div class="sum">
          <div class="r"><span>Status</span><span>${paid ? '<span class="bd-badge bd-badge-green">Paid</span>' : (o.payment_status === 'failed' ? 'Failed' : 'Pending')}</span></div>
          ${o.razorpay_payment_id ? `<div class="r"><span>Payment ID</span><span style="font-size:12.5px">${esc(o.razorpay_payment_id)}</span></div>` : ''}
          ${o.paid_at ? `<div class="r"><span>Paid on</span><span>${esc(BD.fmtDay(o.paid_at))}</span></div>` : ''}
        </div></div>
      </div>
      <p style="text-align:center;margin-top:8px"><a class="bd-link" href="/order/">Track another order</a></p>`;
    $('lookup-view').classList.add('hidden');
    $('order-view').classList.remove('hidden');
    const copy = $('copy-awb');
    if(copy) copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(o.tracking_number); BD.toast('Tracking number copied'); } catch(e){ prompt('Tracking number', o.tracking_number); }
    });
    document.querySelectorAll('[data-review]').forEach(a => a.addEventListener('click', () => {
      try { sessionStorage.setItem('bd_review_prefill', JSON.stringify({ book_id: parseInt(a.dataset.review, 10), order_id: String(o.id), phone: o.buyer_phone, name: o.buyer_name })); } catch(e){}
    }));
    window.scrollTo({ top: 0 });
  }

  const p = new URLSearchParams(location.search);
  if(p.get('id') && (p.get('t') || p.get('phone'))){
    $('lookup-view').classList.add('hidden');
    $('order-view').classList.remove('hidden');
    $('order-view').innerHTML = '<div class="panel"><div class="bd-skeleton" style="height:28px;width:40%;margin-bottom:20px"></div><div class="bd-skeleton" style="height:70px"></div></div>';
    lookup({ id: p.get('id'), ...(p.get('t') ? { t: p.get('t') } : { phone: p.get('phone') }) }).catch(err => {
      $('order-view').classList.add('hidden');
      $('lookup-view').classList.remove('hidden');
      $('oid').value = p.get('id');
      $('lookup-msg').textContent = err.message;
    });
  }
})();
</script>
</body>
</html>
