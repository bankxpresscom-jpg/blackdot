<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--bd-bg);color:var(--bd-ink);font-family:var(--bd-sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  img{display:block;max-width:100%;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px;}

  /* hero */
  .hero{position:relative;min-height:280px;display:flex;align-items:center;overflow:hidden;background:#111;color:#fff;}
  .hero::before{content:'';position:absolute;inset:0;background:url('https://res.cloudinary.com/dhn6pvsr1/image/upload/f_auto,q_auto,w_1600/v1784738287/pexels-cottonbro-4855328_rdigyf.jpg') center 35%/cover no-repeat;filter:grayscale(.35) brightness(.55);transform:scale(1.05);animation:heroZoom 14s ease-out forwards;}
  .hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.25) 70%,rgba(0,0,0,.1) 100%);}
  @keyframes heroZoom{to{transform:scale(1);}}
  .hero .wrap{position:relative;z-index:1;width:100%;padding-top:56px;padding-bottom:56px;}
  .hero h1{font:500 clamp(42px,6vw,68px)/1.02 var(--bd-serif);letter-spacing:.005em;}
  .hero p{font-size:clamp(16px,2vw,19px);opacity:.88;margin-top:12px;font-family:var(--bd-serif);font-style:italic;}
  .hero .count{margin-top:22px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;}

  /* toolbar */
  .toolbar{position:sticky;top:var(--hdr,104px);z-index:50;background:rgba(250,250,250,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--bd-border);}
  .tabs{display:flex;gap:28px;overflow-x:auto;scrollbar-width:none;padding-top:18px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{background:none;border:0;padding:0 0 14px;font:400 14.5px var(--bd-sans);color:var(--bd-muted);cursor:pointer;position:relative;white-space:nowrap;}
  .tab.active{color:var(--bd-ink);font-weight:600;}
  .tab::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--bd-ink);transform:scaleX(0);transition:transform .3s var(--bd-ease);}
  .tab.active::after{transform:scaleX(1);}
  .tab .n{font-size:11px;color:var(--bd-muted);font-weight:400;margin-left:4px;}
  .filters{display:flex;gap:10px;align-items:center;padding:12px 0 14px;}
  .search{flex:1;position:relative;max-width:420px;}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--bd-muted);}
  .search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--bd-border);border-radius:var(--bd-radius);font:14px var(--bd-sans);background:#fff;}
  .search input:focus,.sort:focus{outline:none;border-color:var(--bd-accent);box-shadow:0 0 0 3px var(--bd-accent-soft);}
  .sort{padding:10px 12px;border:1px solid var(--bd-border);border-radius:var(--bd-radius);font:14px var(--bd-sans);background:#fff;color:var(--bd-ink);margin-left:auto;}
  .result-note{font-size:13px;color:var(--bd-muted);white-space:nowrap;}
  .result-note:empty{display:none;}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;padding:32px 0 20px;}
  @media(max-width:1080px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:14px;}}
  .card{background:#fff;border:1px solid var(--bd-border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;transition:transform .35s var(--bd-ease),box-shadow .35s var(--bd-ease);animation:cardIn .6s var(--bd-ease) both;}
  .card:hover{transform:translateY(-4px);box-shadow:0 22px 44px -26px rgba(0,0,0,.35);}
  @keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  .cover{position:relative;display:block;padding:18px 18px 0;background:linear-gradient(180deg,#F4F2EE,#fff);}
  .cover-inner{aspect-ratio:2/3;overflow:hidden;border-radius:2px 4px 4px 2px;box-shadow:0 14px 26px -14px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.08);position:relative;}
  .cover-inner::after{content:'';position:absolute;inset:0 auto 0 0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.08) 60%,transparent);}
  .cover img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--bd-ease);}
  .card:hover .cover img{transform:scale(1.035);}
  .ribbon{position:absolute;top:12px;left:12px;z-index:2;}
  .body{padding:16px 16px 18px;display:flex;flex-direction:column;flex:1;}
  .body h2{font:600 19px/1.2 var(--bd-serif);margin-bottom:3px;}
  .body h2 a{text-decoration:none;}
  .body h2 a:hover{text-decoration:underline;text-underline-offset:3px;}
  .author{font-size:13px;color:var(--bd-muted);margin-bottom:8px;}
  .rating{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--bd-muted);margin-bottom:10px;min-height:18px;text-decoration:none;}
  .price-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .price{font:600 22px var(--bd-sans);letter-spacing:-.01em;}
  .mrp{font-size:13px;color:var(--bd-muted);text-decoration:line-through;}
  .off{font-size:12.5px;color:var(--bd-green);font-weight:600;}
  .eta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--bd-muted);margin-bottom:14px;}
  .eta svg{width:16px;height:16px;flex-shrink:0;}
  .card .bd-btn{margin-top:auto;}
  @media(max-width:760px){
    .cover{padding:12px 12px 0;}
    .body{padding:12px 12px 14px;}
    .body h2{font-size:17px;}
    .price{font-size:19px;}
    .card .bd-btn{padding:11px 10px;font-size:13px;}
    .eta{font-size:11.5px;}
    .filters{flex-wrap:wrap;}
    .search{max-width:none;flex-basis:100%;}
    .sort{margin-left:0;}
  }
  .skeleton-card{background:#fff;border:1px solid var(--bd-border);border-radius:10px;padding:16px;}
  .skeleton-card .s1{aspect-ratio:2/3;margin-bottom:14px;}
  .skeleton-card .s2{height:18px;width:80%;margin-bottom:8px;}
  .skeleton-card .s3{height:14px;width:55%;margin-bottom:16px;}
  .skeleton-card .s4{height:40px;}
  .empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--bd-muted);border:1px dashed var(--bd-border);border-radius:10px;background:#fff;}
  .empty h3{font:500 26px var(--bd-serif);color:var(--bd-ink);margin-bottom:8px;}
  .empty .bd-btn{margin-top:18px;}

  .promise{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd-border);border:1px solid var(--bd-border);border-radius:10px;overflow:hidden;margin-top:40px;}
  .promise div{background:#fff;padding:22px;display:flex;gap:14px;align-items:flex-start;}
  .promise svg{width:26px;height:26px;color:var(--bd-accent);flex-shrink:0;}
  .promise h4{font:600 17px var(--bd-serif);margin-bottom:2px;}
  .promise p{font-size:13px;color:var(--bd-muted);}
  @media(max-width:760px){.promise{grid-template-columns:1fr;}}
</style>

<section class="hero">

<div class="toolbar" id="toolbar">
  <div class="wrap">
    <div class="tabs" role="tablist" id="tabs"><button class="tab active" role="tab" aria-selected="true" data-cat="all">All Books</button></div>
    <div class="filters">
      <label class="search"><span class="bd-sr">Search books</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="book-search" type="search" placeholder="Search by title or author" autocomplete="off"></label>

    <div class="skeleton-card"><div class="bd-skeleton s1"></div><div class="bd-skeleton s2"></div><div class="bd-skeleton s3"></div><div class="bd-skeleton s4"></div></div>

    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8.3-7 9.5C8.5 19.3 5 16 5 11V6z"/><path d="M9 12l2 2 4-4"/></svg><div><h4>Secure Payment</h4><p>UPI, cards, net banking and wallets through Razorpay.</p></div></div>

<script>
(function(){
  const { esc, money, img, stars, ICONS } = BD;
  const grid = document.getElementById('grid');
  const tabsEl = document.getElementById('tabs');
  const searchEl = document.getElementById('book-search');
  const sortEl = document.getElementById('sort');
  const params = new URLSearchParams(location.search);
  const state = { cat: params.get('cat') || 'all', q: params.get('q') || '', sort: params.get('sort') || 'featured' };
  let allBooks = [], cfg = {};

  // keep the toolbar pinned just under the sticky header
  const headerEl = document.querySelector('.bd-header');
  const setHdr = () => document.documentElement.style.setProperty('--hdr', (headerEl ? headerEl.offsetHeight : 0) + 'px');
  setHdr(); window.addEventListener('resize', setHdr);

  searchEl.value = state.q;
  sortEl.value = state.sort;

  function syncUrl(){
    const p = new URLSearchParams();
    if(state.cat !== 'all') p.set('cat', state.cat);
    if(state.q) p.set('q', state.q);
    if(state.sort !== 'featured') p.set('sort', state.sort);
    const qs = p.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
  }

  function buildTabs(){
    const cats = [];
    allBooks.forEach(b => { if(b.category && !b.coming_soon && !cats.includes(b.category)) cats.push(b.category); });
    cats.sort();
    const soon = allBooks.filter(b => b.coming_soon).length;
    const tabs = [['all','All Books', allBooks.filter(b => !b.coming_soon).length]]
      .concat(cats.map(c => [c, c, allBooks.filter(b => b.category === c && !b.coming_soon).length]));
    if(soon) tabs.push(['soon','Coming Soon', soon]);
    if(!tabs.some(t => t[0] === state.cat)) state.cat = 'all';
    tabsEl.innerHTML = tabs.map(([k,label,n]) =>
      `<button class="tab${k === state.cat ? ' active' : ''}" role="tab" aria-selected="${k === state.cat}" data-cat="${esc(k)}">${esc(label)}<span class="n">${n}</span></button>`).join('');
  }

  function filtered(){
    const q = state.q.trim().toLowerCase();
    let list = allBooks.filter(b => {
      if(state.cat === 'soon') return !!b.coming_soon;
      if(b.coming_soon && state.cat !== 'all') return false;
      if(state.cat !== 'all' && b.category !== state.cat) return false;
      return true;
    });
    if(q) list = list.filter(b => (b.title + ' ' + b.author + ' ' + (b.category||'') + ' ' + (b.tagline||'')).toLowerCase().includes(q));
    const by = {
      'featured': (a,b) => (b.featured - a.featured) || (a.coming_soon - b.coming_soon),
      'rating': (a,b) => (b.rating_avg - a.rating_avg) || (b.rating_count - a.rating_count),
      'price-asc': (a,b) => a.price_paise - b.price_paise,
      'price-desc': (a,b) => b.price_paise - a.price_paise,
      'title': (a,b) => a.title.localeCompare(b.title),
    }[state.sort];
    return by ? [...list].sort(by) : list;
  }

  function cardHtml(b, i){
    const cover = img(b.images[0] || b.cover_url, 500);
    const off = b.mrp_paise ? Math.round((1 - b.price_paise / b.mrp_paise) * 100) : 0;
    const inCart = BD.cart.has(b.id);
    let ribbon = '';
    if(b.coming_soon) ribbon = '<span class="bd-badge bd-badge-dark ribbon">Coming Soon</span>';
    else if(!b.in_stock) ribbon = '<span class="bd-badge bd-badge-dark ribbon">Out of stock</span>';
    else if(b.featured) ribbon = '<span class="bd-badge bd-badge-soft ribbon">Featured</span>';
    const rating = b.rating_count
      ? `<a class="rating" href="${esc(b.url)}#reviews">${stars(b.rating_avg, 14)}<span>(${b.rating_count})</span></a>`
      : `<div class="rating">${stars(0, 14)}<span>New</span></div>`;
    let action;
    if(b.coming_soon) action = `<a class="bd-btn bd-btn-ghost bd-btn-block" href="${esc(BD.whatsappLink('Hi Blackdot Publication, please notify me when "' + b.title + '" is released.'))}" target="_blank" rel="noopener">Notify Me</a>`;
    else if(!b.in_stock) action = `<button class="bd-btn bd-btn-ghost bd-btn-block" disabled>Out of Stock</button>`;
    else if(inCart) action = `<button class="bd-btn bd-btn-outline bd-btn-block" data-open-cart>${ICONS.check} In Cart</button>`;
    else action = `<button class="bd-btn bd-btn-primary bd-btn-block" data-add="${b.id}">Add to Cart</button>`;
    return `
      <article class="card" style="animation-delay:${Math.min(i, 8) * 45}ms">
        <a class="cover" href="${esc(b.url)}" aria-label="${esc(b.title)}">${ribbon}<div class="cover-inner"><img src="${esc(cover)}" alt="${esc(b.title)} by ${esc(b.author)}, book cover" loading="${i < 4 ? 'eager' : 'lazy'}"></div></a>
        <div class="body">
          <h2><a href="${esc(b.url)}">${esc(b.title)}</a></h2>
          <div class="author">by ${esc(b.author)}</div>
          ${rating}
          <div class="price-row"><span class="price">${money(b.price_paise)}</span>${b.mrp_paise ? `<span class="mrp">${money(b.mrp_paise)}</span><span class="off">${off}% off</span>` : ''}</div>
          ${b.coming_soon ? '<div class="eta">Releasing soon</div>' : `<div class="eta">${ICONS.truck}<span>Get it by ${BD.deliveryBy(cfg)}</span></div>`}
          ${action}
        </div>
      </article>`;
  }

  function render(){
    const list = filtered();
    document.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.cat === state.cat;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on);
    });
    document.getElementById('result-note').textContent = state.q ? `${list.length} result${list.length === 1 ? '' : 's'}` : '';
    if(!list.length){
      grid.innerHTML = allBooks.length
        ? `<div class="empty"><h3>No books found</h3><p>Try a different search or category.</p><button class="bd-btn bd-btn-dark" type="button" data-reset>Show all books</button></div>`
        : `<div class="empty"><h3>New titles are on their way</h3><p>Our first books will appear here very soon.</p><a class="bd-btn bd-btn-dark" href="/">Back to Home</a></div>`;
      return;
    }
    grid.innerHTML = list.map(cardHtml).join('');
  }

  grid.addEventListener('click', e => {
    const add = e.target.closest('[data-add]');
    if(add){
      const b = allBooks.find(x => x.id === parseInt(add.dataset.add, 10));
      BD.addToCart(b, 1);
      return;
    }
    if(e.target.closest('[data-open-cart]')){ BD.openCart(); return; }
    if(e.target.closest('[data-reset]')){ state.q = ''; state.cat = 'all'; searchEl.value = ''; syncUrl(); render(); }
  });
  tabsEl.addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if(!t) return;
    state.cat = t.dataset.cat; syncUrl(); render();
  });
  let debounce;
  searchEl.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { state.q = searchEl.value; syncUrl(); render(); }, 160);
  });
  sortEl.addEventListener('change', () => { state.sort = sortEl.value; syncUrl(); render(); });
  document.addEventListener('bd:cart', () => { if(allBooks.length) render(); });

  Promise.all([BD.books(), BD.config()]).then(([books, c]) => {
    allBooks = books; cfg = c;
    const live = books.filter(b => !b.coming_soon).length;
    document.getElementById('hero-count').textContent = live ? `${live} title${live === 1 ? '' : 's'} available` : '';
    buildTabs(); render();
  }).catch(() => {
    grid.innerHTML = `<div class="empty"><h3>We couldn't load the books</h3><p>Please check your connection and try again.</p><button class="bd-btn bd-btn-dark" type="button" onclick="location.reload()">Retry</button></div>`;
  });
})();
</script>
</body>
</html>
